[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "web"

[services.crons]

[[services.crons.entries]]
schedule = "*/15 * * * *"
command = "curl -X POST $NEXT_PUBLIC_APP_URL/api/cron/fire-queue -H 'Authorization: Bearer $CRON_SECRET'"

[[services.crons.entries]]
schedule = "0 * * * *"
command = "curl -X POST $NEXT_PUBLIC_APP_URL/api/analytics/sync -H 'Authorization: Bearer $CRON_SECRET'"

[[services.crons.entries]]
schedule = "0 6 * * *"
command = "curl -X POST $NEXT_PUBLIC_APP_URL/api/cron/health-check -H 'Authorization: Bearer $CRON_SECRET'"
